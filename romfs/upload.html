<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3DS Jigsaw: add pictures</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 1em; background: #1e2026; color: #e6e6e6; }
  #main { max-width: 30em; margin: 2em auto; padding: 1em; background: #2a2d35; border-radius: 1em;
    display: flex; flex-direction: column; gap: 0.75em; }
  h2 { margin: 0.2em; text-align: center; color: #f0c85a; }
  p { margin: 0; color: #aaa; font-size: 0.9em; text-align: center; }
  input, button { font-size: 1em; padding: 0.6em; border-radius: 0.5em; border: none; }
  input { background: #e6e6e6; color: #222; }
  button { background: #f0c85a; color: #222; font-weight: bold; cursor: pointer; }
  button:disabled { filter: grayscale(1) brightness(0.7); cursor: default; }
  #names { display: flex; flex-direction: column; gap: 0.4em; }
  #names label { display: flex; flex-direction: column; gap: 0.2em; font-size: 0.85em; color: #aaa; overflow-wrap: anywhere; }
  #log { list-style: none; margin: 0; padding: 0; font-size: 0.9em; }
  #log li { padding: 0.3em 0.5em; border-radius: 0.3em; margin-top: 0.3em; background: #1e2026; overflow-wrap: anywhere; }
  .ok { color: #8fd88f; } .bad { color: #ff8c78; }
</style>
</head>
<body>
<div id="main">
  <h2>Add pictures to 3DS Jigsaw</h2>
  <p>Pictures are shrunk to 1024 pixels on the long side before they're sent.</p>
  <input type="file" id="files" multiple accept="image/*" onchange="showNames()">
  <div id="names"></div>
  <button id="send" onclick="sendAll()">Send to 3DS</button>
  <ul id="log"></ul>
</div>
<script>
const MAXSIDE = 1024, QUALITY = 0.92;

function line(text, cls) {
  const li = document.createElement('li');
  li.textContent = text;
  if(cls) li.className = cls;
  document.getElementById('log').appendChild(li);
  return li;
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("can't read this picture")); };
    img.src = url;
  });
}

// Long side at most MAXSIDE (never bigger), on white (no transparency), as a JPEG
async function shrink(file) {
  const img = await loadImage(file);
  const scale = Math.min(1, MAXSIDE / Math.max(img.naturalWidth, img.naturalHeight));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
  canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  return new Promise((resolve, reject) => canvas.toBlob(
    b => b ? resolve(b) : reject(new Error("couldn't make a JPEG")), 'image/jpeg', QUALITY));
}

// The name each picture gets on the 3DS (editable; the 3DS keeps letters, digits, spaces
// and - _ ( ) ' , and adds .jpg)
function baseName(name) {
  const dot = name.lastIndexOf('.');
  return dot > 0 ? name.slice(0, dot) : name;
}

function showNames() {
  const box = document.getElementById('names');
  box.textContent = '';
  for(const file of document.getElementById('files').files) {
    const label = document.createElement('label');
    label.textContent = file.name;
    const input = document.createElement('input');
    input.value = baseName(file.name);
    input.maxLength = 60;
    label.appendChild(input);
    box.appendChild(label);
  }
}

async function sendAll() {
  const files = document.getElementById('files').files;
  const button = document.getElementById('send');
  if(!files.length) { line('Pick some pictures first', 'bad'); return; }
  button.disabled = true;
  let saved = 0;
  const names = document.querySelectorAll('#names input');
  // One at a time: the 3DS takes one upload at a time
  for(let i = 0; i < files.length; i++) {
    const file = files[i];
    // Sent with .jpg so the 3DS's "drop the extension" step doesn't eat part of a typed name
    const name = ((names[i] && names[i].value.trim()) || baseName(file.name)) + '.jpg';
    const li = line(file.name + ': shrinking...');
    try {
      const jpeg = await shrink(file);
      li.textContent = file.name + ': sending ' + Math.round(jpeg.size / 1024) + ' KB...';
      const r = await fetch('/upload?name=' + encodeURIComponent(name),
        { method: 'POST', headers: { 'Content-Type': 'image/jpeg' }, body: jpeg });
      const text = await r.text();
      if(!r.ok) throw new Error(text || ('error ' + r.status));
      li.textContent = file.name + ': ' + text;
      li.className = 'ok';
      saved++;
    } catch(e) {
      li.textContent = file.name + ': failed (' + e.message + ')';
      li.className = 'bad';
    }
  }
  line(saved + ' of ' + files.length + ' sent. They are in the puzzle list on the 3DS.');
  button.disabled = false;
}
</script>
</body>
</html>
